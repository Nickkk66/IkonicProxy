<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Relative, not root-absolute: Pages serves this from /<repo>/ -->
    <script src="scram/scramjet.all.js"></script>
    <script src="baremux/index.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Scramjet</h1>
      <p class="sub">Self-hosted proxy &mdash; frontend on Pages, wisp backend on your PC.</p>
    </header>

    <form id="form">
      <input id="address" type="text" placeholder="Enter a URL or search term" autocomplete="off" />
      <button type="submit">Go</button>
    </form>

    <p id="status"></p>

    <details class="settings">
      <summary>Backend settings</summary>

      <div id="locked">
        <p class="hint">Enter the password to view or change the backend.</p>
        <div class="row">
          <input id="pw" type="password" placeholder="Password" autocomplete="off" />
          <button id="unlock" type="button">Unlock</button>
        </div>
      </div>

      <div id="unlocked" hidden>
        <p class="hint">
          The backend runs on the owner's PC. Paste the address Cloudflare Tunnel prints &mdash;
          <code>https://</code> is fine, it gets converted. Stored in this browser only.
        </p>
        <div class="row">
          <input id="wisp" type="text" placeholder="https://your-tunnel.trycloudflare.com" />
        </div>
        <div class="row">
          <button id="save" type="button">Save</button>
          <button id="reset" type="button" class="secondary">Reset to default</button>
        </div>
      </div>
    </details>
  </body>
</html>
