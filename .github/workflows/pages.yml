name: Deploy frontend to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # No secrets are baked in any more. The deployed page asks the backend
      # for the token in exchange for the access code (POST /unlock on the
      # backend), so the only thing this build needs is DEFAULT_WISP in
      # public/app.js pointing at the backend's current address -- the setup
      # menu writes that for you ("Use that address as the site default").
      #
      # public/ already contains the vendored proxy assets, so there is nothing
      # to build -- upload it as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
